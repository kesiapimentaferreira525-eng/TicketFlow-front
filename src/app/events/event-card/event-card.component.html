<article class="event-card" tabindex="0" (click)="onSelect()" (keydown.enter)="onSelect()">
  <div class="event-card__media">
    @if (event.imageUrl) {
      <img [src]="event.imageUrl" [alt]="event.title" loading="lazy" />
    } @else {
      <div class="event-card__placeholder" aria-hidden="true">Sem imagem</div>
    }
    <span class="event-card__price">{{ formattedPrice }}</span>
  </div>

  <div class="event-card__body">
    @if (event.category) {
      <span class="event-card__tag">{{ event.category }}</span>
    }
    <h3 class="event-card__title">{{ event.title }}</h3>
    <p class="event-card__meta">
      <span class="event-card__icon" aria-hidden="true">📅</span>
      {{ formattedDate }}
    </p>
    <p class="event-card__meta">
      <span class="event-card__icon" aria-hidden="true">📍</span>
      {{ event.location }}
    </p>
    <span class="event-card__cta">Ver detalhes →</span>
  </div>
</article>
